# Ksign Next — build + test + IPA export on a macOS runner.
# Signing: the archive is built UNSIGNED (CODE_SIGNING_ALLOWED=NO) and
# the IPA is packaged by hand from the archive, so it can be installed
# with SideStore / AltStore, which re-signs it with a personal
# certificate on the user's device. No Apple Developer Team ID,
# certificate or provisioning profile is needed in CI, and none are
# stored in the repo. Do NOT put certificates, P12 files or passwords
# in the repo.
name: Build IPA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # arm64 runner: Intel runners stall booting the simulator (xcodebuild's
    # install worker times out after 60s, then hangs) in every run.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode 17
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version
          python3 --version

      - name: Regenerate Xcode project (verifies file list)
        run: python3 Scripts/generate_project.py

      - name: Generate AppIcon PNGs (binary icons are not in the repo)
        run: |
          pip install --quiet pillow
          python3 Scripts/generate_appicon.py

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project KsignNext.xcodeproj -scheme KsignNext

      # The test step hung three times right after the test bundles
      # finished building, before any test started: xcodebuild stalls
      # launching the iOS 26 simulator on the Intel runner. Boot a
      # known-good iOS 18.6 simulator explicitly first and pass its
      # UDID to the test step, so both steps use the same device.
      # (simctl JSON runtime keys use dashes, e.g. iOS-18-6, so the
      # version is normalized before matching. macOS has no `timeout`
      # command, so the boot wait is bounded in Python instead.)
      - name: Boot iPhone simulator
        run: |
          python3 - <<'EOF'
          import json, os, subprocess
          out = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"])
          data = json.loads(out)
          candidates = []
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              ver = runtime.rsplit("iOS-", 1)[-1].replace("-", ".")
              for d in devices:
                  if d["name"] == "iPhone 16" and d["isAvailable"]:
                      candidates.append((ver, d["udid"]))
          if not candidates:
              raise SystemExit("No available iPhone 16 simulator found")
          # Prefer iOS 18.6 (known-good on Intel); otherwise the oldest iOS.
          candidates.sort(key=lambda c: (c[0] != "18.6", c[0]))
          ver, udid = candidates[0]
          print(f"Booting iPhone 16 (iOS {ver}): {udid}")
          subprocess.run(["xcrun", "simctl", "boot", udid], check=False)
          try:
              subprocess.run(["xcrun", "simctl", "bootstatus", udid, "-b"], timeout=900, check=False)
          except subprocess.TimeoutExpired:
              print("bootstatus timed out after 900s; continuing anyway")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"SIM_UDID={udid}\n")
          print(subprocess.check_output(["xcrun", "simctl", "list", "devices", "booted"]).decode())
          EOF

      - name: Build tests (no execution)
        timeout-minutes: 30
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build-for-testing \
            -project KsignNext.xcodeproj \
            -scheme KsignNext \
            -destination 'platform=iOS Simulator,id=${{ env.SIM_UDID }}' \
            -only-testing:KsignNextTests \
            ONLY_ACTIVE_ARCH=YES 2>&1 | tee build/test.log

      - name: Run unit + integration + security tests
        # Strict test judge (B-J1): the old judge passed on partial
        # execution — when xcodebuild was killed mid-suite no
        # TEST SUCCEEDED / TEST FAILED ever printed, so it fell through
        # to "count > 0, no failure string → exit 0" and reported green
        # while suites never ran. Now xcodebuild runs in the foreground
        # (one timeout mechanism: this step's timeout-minutes: 30 — the
        # old manual 12-minute deadline + kill loop is gone, B-J2) and
        # the judge parses the canonical "Executed N tests, with M
        # failures" summary: it fails when no summary exists, when M
        # != 0, or when N != the test-method count computed from
        # source. A green run now proves every test executed and
        # passed. (xcodebuild writes "Test case" with a lowercase c.)
        timeout-minutes: 30
        run: |
          python3 - <<'PY'
          import os, subprocess
          udid = os.environ["SIM_UDID"]
          subprocess.run(["xcrun", "simctl", "shutdown", udid], capture_output=True)
          subprocess.run(["xcrun", "simctl", "erase", udid], check=True)
          subprocess.run(["xcrun", "simctl", "boot", udid], check=True)
          subprocess.run(["xcrun", "simctl", "bootstatus", udid, "-b"], check=True, timeout=600)
          print("Simulator ready:", udid)
          PY
          set -o pipefail
          # Count only the KsignNextTests bundle: UITests lives in its own
          # target (KsignNextUITests) and is never run by
          # -only-testing:KsignNextTests, so exclude it or the judge
          # would demand tests that can never execute.
          EXPECTED=$(grep -rh "func test" Tests/ --exclude-dir=UITests | wc -l | tr -d ' ')
          echo "Expected test methods (from source, KsignNextTests bundle): $EXPECTED"
          xcodebuild test-without-building \
            -project KsignNext.xcodeproj \
            -scheme KsignNext \
            -destination 'platform=iOS Simulator,id=${{ env.SIM_UDID }}' \
            -disable-concurrent-testing \
            -only-testing:KsignNextTests \
            ONLY_ACTIVE_ARCH=YES 2>&1 | tee build/test.log || true
          EXPECTED="$EXPECTED" python3 - <<'PY'
          import os, re, sys
          expected = int(os.environ["EXPECTED"])
          text = open("build/test.log", errors="replace").read()
          found = re.findall(r"Executed (\d+) tests, with (\d+) failures", text)
          if not found:
              print("No test summary found in build/test.log — test execution did not complete.")
              sys.exit(1)
          total, failures = map(int, found[-1])
          print(f"Test summary (last): executed {total}, failures {failures}; expected {expected} tests.")
          if failures != 0:
              print(f"FAIL: {failures} test failure(s).")
              sys.exit(1)
          if total != expected:
              print(f"FAIL: only {total} of {expected} tests executed — partial execution.")
              sys.exit(1)
          print("All tests executed and passed.")
          PY

      - name: Archive (Release, unsigned for SideStore)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project KsignNext.xcodeproj \
            -scheme KsignNext \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/KsignNext.xcarchive \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/archive.log

      - name: Export IPA (unsigned, for SideStore re-signing)
        run: |
          if [ -d build/KsignNext.xcarchive ]; then
            mkdir -p build/Export/Payload
            cp -R build/KsignNext.xcarchive/Products/Applications/KsignNext.app build/Export/Payload/
            (cd build/Export && zip -r -q KsignNext.ipa Payload) 2>&1 | tee build/export.log
          else
            echo "No archive produced."
            exit 1
          fi

      - name: Validate IPA + SHA-256
        if: success()
        run: |
          python3 Scripts/inspect_ipa.py build/Export/KsignNext.ipa
          shasum -a 256 build/Export/KsignNext.ipa | tee build/KsignNext.ipa.sha256

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: KsignNext-ipa
          path: |
            build/Export/KsignNext.ipa
            build/KsignNext.ipa.sha256
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-logs
          path: build/*.log
          if-no-files-found: ignore
