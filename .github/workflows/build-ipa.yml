# Ksign Next — build + test + IPA export on a macOS runner.
# Signing: the archive is built UNSIGNED (CODE_SIGNING_ALLOWED=NO) and
# the IPA is packaged by hand from the archive, so it can be installed
# with SideStore / AltStore, which re-signs it with a personal
# certificate on the user's device. No Apple Developer Team ID,
# certificate or provisioning profile is needed in CI, and none are
# stored in the repo. Do NOT put certificates, P12 files or passwords
# in the repo.
#
# DRAFT — Phase 1 Rust Apple-refresh core (design doc §8.2). This file
# lives at /tmp/rust-workflow-build-ipa.yml and is NOT the workflow in
# the repo: workflow files cannot be pushed via API, so the parent
# applies this content via the browser. Do NOT copy it over
# .github/workflows/build-ipa.yml by hand-editing the repo copy.
name: Build IPA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 17
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version
          python3 --version

      # Phase 1 Rust core (design doc §8.2): build the isideload-based
      # Apple-refresh XCFramework BEFORE "Regenerate Xcode project",
      # because the generator links RustCore/AppleRefresh.xcframework
      # into the app target only when it exists on disk (and fails
      # hard when REQUIRE_RUST_XCFRAMEWORK=1, set on the regenerate
      # step below). Cache keyed on Cargo.lock (Swatinem/rust-cache,
      # the action the design doc recommends); a clean build of this
      # tree is several minutes (ring compiles C/assembly).
      # NOTE: RustCore/apple_refresh/Cargo.lock must exist in the repo
      # before the first run with this step — the build uses --locked
      # and fails if the lock is missing or out of date. Generate it
      # once with `cargo generate-lockfile` in RustCore/apple_refresh
      # (or let Scripts/build_rust_core.sh do it on its first run)
      # and commit it.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: RustCore/apple_refresh

      - name: Build Rust Apple-refresh core (XCFramework)
        run: |
          set -o pipefail
          rustup toolchain install stable
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios-sim
          rustc --version; cargo --version
          cd RustCore/apple_refresh
          cargo build --release --locked --target aarch64-apple-ios
          cargo build --release --locked --target aarch64-apple-ios-sim
          cargo build --release --locked --target x86_64-apple-ios-sim
          cd ../..
          xcodebuild -create-xcframework \
            -library RustCore/apple_refresh/target/aarch64-apple-ios/release/libapple_refresh.a \
            -headers RustCore/apple_refresh/include \
            -library RustCore/apple_refresh/target/aarch64-apple-ios-sim/release/libapple_refresh.a \
            -headers RustCore/apple_refresh/include \
            -library RustCore/apple_refresh/target/x86_64-apple-ios-sim/release/libapple_refresh.a \
            -headers RustCore/apple_refresh/include \
            -output RustCore/AppleRefresh.xcframework
          ls -R RustCore/AppleRefresh.xcframework

      - name: Regenerate Xcode project (verifies file list)
        env:
          REQUIRE_RUST_XCFRAMEWORK: "1"
        run: python3 Scripts/generate_project.py

      - name: Generate AppIcon PNGs (binary icons are not in the repo)
        run: |
          pip install --quiet pillow
          python3 Scripts/generate_appicon.py

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project KsignNext.xcodeproj -scheme KsignNext

      - name: Run unit + integration + security tests
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project KsignNext.xcodeproj \
            -scheme KsignNext \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -only-testing:KsignNextTests \
            ONLY_ACTIVE_ARCH=YES 2>&1 | tee build/test.log

      - name: Archive (Release, unsigned for SideStore)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project KsignNext.xcodeproj \
            -scheme KsignNext \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/KsignNext.xcarchive \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/archive.log

      - name: Export IPA (unsigned, for SideStore re-signing)
        run: |
          if [ -d build/KsignNext.xcarchive ]; then
            mkdir -p build/Export/Payload
            cp -R build/KsignNext.xcarchive/Products/Applications/KsignNext.app build/Export/Payload/
            (cd build/Export && zip -r -q KsignNext.ipa Payload) 2>&1 | tee build/export.log
          else
            echo "No archive produced."
            exit 1
          fi

      - name: Validate IPA + SHA-256
        if: success()
        run: |
          python3 Scripts/inspect_ipa.py build/Export/KsignNext.ipa
          shasum -a 256 build/Export/KsignNext.ipa | tee build/KsignNext.ipa.sha256

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KsignNext-ipa
          path: |
            build/Export/KsignNext.ipa
            build/KsignNext.ipa.sha256
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/*.log
          if-no-files-found: ignore
